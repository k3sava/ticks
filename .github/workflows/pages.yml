name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          set -eu
          mkdir -p _site _site/.well-known _site/.well-known/agent-skills
          # Disable Jekyll so dotfile dirs (.well-known) actually serve.
          touch _site/.nojekyll
          # Required: site cannot deploy without these.
          cp index.html app.js style.css data.json _site/
          # Custom domain for GitHub Pages — CNAME bound to ticks.iamkesava.com.
          if [ -f CNAME ]; then cp CNAME _site/; fi
          # Optional: copy each only if present so a partial repo (e.g. before
          # the SEO/AEO pass lands) still deploys cleanly.
          for f in llms.txt robots.txt sitemap.xml rss.xml \
                   featured.json search-index.json \
                   og.png og-manifest.json; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          # Per-tick OG images (~200 PNGs). Only copy the directory if it has files.
          if [ -d og ] && [ -n "$(ls -A og 2>/dev/null)" ]; then
            cp -R og _site/og
          fi
          # Agent-readiness endpoints under /.well-known/.
          if [ -f .well-known/agent-permissions.json ]; then
            cp .well-known/agent-permissions.json _site/.well-known/
          fi
          if [ -f .well-known/api-catalog ]; then
            cp .well-known/api-catalog _site/.well-known/
          fi
          if [ -f .well-known/agent-skills/index.json ]; then
            cp .well-known/agent-skills/index.json _site/.well-known/agent-skills/
          fi
          # Legacy SPA, kept reachable at /legacy.html for old shares.
          if [ -f ticks.html ]; then cp ticks.html _site/legacy.html; fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
