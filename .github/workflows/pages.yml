name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html app.js style.css data.json _site/
          cp llms.txt robots.txt sitemap.xml _site/
          [ -f rss.xml ] && cp rss.xml _site/ || true
          [ -f search-index.json ] && cp search-index.json _site/ || true
          mkdir -p _site/.well-known
          [ -f .well-known/agent-permissions.json ] && cp .well-known/agent-permissions.json _site/.well-known/ || true
          cp ticks.html _site/legacy.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
