<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Ticks — moments that unlocked everything next</title>
<meta name="description" content="1,022 moments in history when a constraint dissolved and everything downstream became possible. Walk the chain forward or backward." />
<meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0C0A09" media="(prefers-color-scheme: dark)" />
<meta property="og:title" content="Ticks" />
<meta property="og:description" content="1,022 moments. Each one dissolved a constraint. Each one made the next one possible." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <header id="hdr">
    <a class="brand" href="#/" aria-label="Ticks home">
      <span class="brand-mark"></span>
      <span class="brand-name">ticks</span>
    </a>
    <nav id="nav" aria-label="Modes">
      <a href="#/walk" data-mode="walk">walk</a>
      <a href="#/map" data-mode="map">map</a>
      <a href="#/hunt" data-mode="hunt">hunt</a>
      <a href="#/browse" data-mode="browse">browse</a>
      <a href="#/about" data-mode="about">about</a>
    </nav>
    <div class="hdr-right">
      <button id="randomBtn" type="button" title="Random tick (press R)">surprise me</button>
      <button id="themeBtn" type="button" aria-label="Toggle theme" title="Toggle theme">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13 8.5A5 5 0 0 1 7.5 3a.5.5 0 0 0-.7-.5A6 6 0 1 0 13.5 9.2a.5.5 0 0 0-.5-.7Z"/></svg>
      </button>
    </div>
    <button id="menuBtn" type="button" aria-label="Open menu">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </button>
  </header>

  <div id="mobileBackdrop"></div>
  <nav id="mobileMenu" aria-label="Mobile menu">
    <div class="mm-head">
      <button class="mm-theme" id="themeBtnMobile" type="button" aria-label="Toggle theme">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13 8.5A5 5 0 0 1 7.5 3a.5.5 0 0 0-.7-.5A6 6 0 1 0 13.5 9.2a.5.5 0 0 0-.5-.7Z"/></svg>
      </button>
      <button class="mm-close" id="menuClose" type="button" aria-label="Close menu">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l10 10M13 3 3 13"/></svg>
      </button>
    </div>
    <a href="#/walk">walk</a>
    <a href="#/map">map</a>
    <a href="#/hunt">hunt</a>
    <a href="#/browse">browse</a>
    <a href="#/about">about</a>
    <button id="randomBtnMobile" type="button">surprise me</button>
  </nav>

  <main id="app" aria-live="polite"></main>

  <footer>
    <span class="ftr-name">ticks</span>
    <span class="ftr-sep">·</span>
    <span id="ftrCount">1,022 moments</span>
    <span class="ftr-sep">·</span>
    <a href="https://github.com/k3sava/ticks" target="_blank" rel="noopener">GitHub</a>
    <span class="ftr-sep">·</span>
    <span>MIT</span>
  </footer>

  <script src="app.js?v=4" type="module"></script>
</body>
</html>
